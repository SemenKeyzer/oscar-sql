# A Windows 11 (64-bit) build of OSCAR to try out: a zip that runs without installing.
# Run by hand only (Actions tab → "Windows build" → Run workflow); the zip is kept 14 days.
#
# Built with Microsoft's compiler (MSVC): Qt Bluetooth works on Windows only in an MSVC build
# (with MinGW it falls back to a dummy backend and finds no device). The fork is built and
# tested with clang on macOS, where warnings are errors; this build does not stop on warnings.

name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 11, Qt 6.10 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version string comes from git

      - name: Install Qt for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport qtconnectivity'
          cache: true

      - name: Set up the MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install zlib (vcpkg)
        shell: pwsh
        run: |
          # Qt 6 does not export zlib's gz* functions: a static zlib with the shared C runtime (/MD)
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows-static-md --classic
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed" }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          Get-ChildItem -Recurse $root -Include *.lib, zlib.h | ForEach-Object { $_.FullName }
          $lib = Get-ChildItem -Recurse "$root\lib" -Filter 'z*.lib' | Select-Object -First 1
          if (-not $lib) { throw "zlib library not found under $root" }
          "ZLIB_DIR=$($root -replace '\\','/')" >> $env:GITHUB_ENV
          "ZLIB_LIB=$($lib.FullName -replace '\\','/')" >> $env:GITHUB_ENV

      - name: Build OSCAR
        shell: cmd
        run: |
          rem /MP compiles the files of a target in parallel; /utf-8 reads the sources as UTF-8; /EHsc C++ exceptions
          set CL=/MP /utf-8
          mkdir build
          cd build
          qmake ..\oscar\oscar.pro CONFIG+=release CONFIG-=debug_and_release "ZLIB_DIR=%ZLIB_DIR%" "ZLIB_LIB=%ZLIB_LIB%"
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1

      - name: Gather OSCAR and the Qt libraries
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter OSCAR.exe | Select-Object -First 1
          if (-not $exe) { throw "OSCAR.exe was not built" }
          New-Item -ItemType Directory -Path OSCAR-Windows | Out-Null   # not "OSCAR": Windows names ignore case, and oscar\ is the source
          Copy-Item $exe.FullName OSCAR-Windows\
          foreach ($dir in 'Translations', 'Html', 'Help') {
            if (Test-Path "build\$dir") { Copy-Item "build\$dir" "OSCAR-Windows\$dir" -Recurse }
          }
          Remove-Item OSCAR-Windows\Translations\*.ts -ErrorAction SilentlyContinue
          windeployqt --release --no-translations OSCAR-Windows\OSCAR.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # the Visual C++ runtime next to OSCAR.exe, so nothing has to be installed
          $crt = Get-ChildItem -Path "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ runtime not found under $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)\*.dll" OSCAR-Windows\
          # a start file that keeps this test build's data apart from an installed OSCAR's
          Set-Content -Path "OSCAR-Windows\Start OSCAR (test data).bat" -Encoding ascii -Value @(
            '@echo off',
            'rem This test build keeps its data in Documents\OSCAR_Data_test, apart from an installed OSCAR.',
            'start "" "%~dp0OSCAR.exe" --datadir OSCAR_Data_test'
          )
          Get-ChildItem OSCAR-Windows | Format-Table Name, Length

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: OSCAR-windows-${{ github.sha }}
          path: OSCAR-Windows
          retention-days: 14
